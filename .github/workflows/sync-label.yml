# This repository is a published, source-only mirror of an internal Databricks
# source of truth (the skills, plugin manifests, hooks, and docs here are synced
# out from that internal repo). The only PRs that should merge are the sync PRs
# that carry those internal changes. This check fails unless the PR carries the
# `sync` label, which only maintainers can apply, making every merge a
# deliberate, maintainer-gated act. Public change proposals belong in issues
# and are implemented internally after maintainer review (see CONTRIBUTING.md).
# Temporary guard until release/sync automation takes over merging.
name: Sync label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  # The label gate runs at PR level: a PR can't enter the merge queue until this
  # check passes there. Merge-group events carry no label context, so on them the
  # job passes trivially; without this trigger a required sync-label check would
  # stall every queue entry (main requires PR + merge queue, see release.yml).
  merge_group:
    types: [checks_requested]

jobs:
  sync-label:
    name: sync-label
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Merge queue, gate already applied at PR level
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "merge group event; sync label was enforced when the PR entered the queue."
      - name: Require the `sync` label
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'sync') }}
        env:
          ERROR_MESSAGE: >-
            This PR does not carry the 'sync' label. This repository is a
            source-only mirror of an internal Databricks source of truth, so
            only internal sync PRs merge here. If this is a sync PR, a
            maintainer must apply the 'sync' label. Other change proposals
            should be submitted as issues (see CONTRIBUTING.md).
        run: |
          echo "::error::$ERROR_MESSAGE"
          exit 1
      - name: Label present
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'sync') }}
        run: echo "sync label present; this is an internal sync PR."
